name: Firmware

# Builds the ESP32 round display firmware and commits the result to firmware/dist/, where the dashboard serves it
# (and the board can read it from GitHub). The build uses config.example.h; the board keeps its own Wi-Fi and
# tokens in its memory, set by the first USB flash (see firmware/esp32-round/README.md).
on:
  push:
    branches: [main]
    paths: ["firmware/esp32-round/**", ".github/workflows/firmware.yml"]
  workflow_dispatch:

permissions:
  contents: write

env:
  ARDUINO_ESP32: "3.3.12"  # the arduino-esp32 core the firmware is built with; the Core update workflow bumps this

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      # Pinned to the arduino-esp32 version the sketch is written and tested against; bump it together with the IDE.
      - name: Install board package and libraries
        run: |
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core install esp32:esp32@${ARDUINO_ESP32} --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli lib install "GFX Library for Arduino" U8g2 ArduinoJson
      - name: Compile
        working-directory: firmware/esp32-round
        run: |
          cp config.example.h config.h
          # The partition table only matters for the size check here: 3MB app slots, as in the IDE's "16M Flash (3MB APP/9.9MB FATFS)".
          arduino-cli compile --fqbn "esp32:esp32:esp32s3:CDCOnBoot=cdc,PSRAM=opi,FlashSize=16M" \
            --build-property "build.partitions=app3M_fat9M_16MB" --build-property "upload.maximum_size=3342336" \
            --build-property "compiler.cpp.extra_flags=-DCI_BUILD" --output-dir /tmp/fw .
      - name: Commit the build
        if: github.ref == 'refs/heads/main'  # other branches (like a core bump) only check that it compiles
        run: |
          cp /tmp/fw/esp32-round.ino.bin firmware/dist/esp32-round.bin
          md5sum firmware/dist/esp32-round.bin | cut -d' ' -f1 > firmware/dist/esp32-round.md5
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/dist
          git diff --cached --quiet || (git commit -m "Firmware: new build [skip ci]" && git push)
