# Try the dashboard without a battery: a simulated Solarbank plus the dashboard.
#   docker compose -f docker-compose.demo.yml up --build
services:
  simulator:
    build: .
    command: ["python", "-m", "simulator.sim", "--port", "5020", "--meter-port", "5021"]
  dashboard:
    build: .
    ports:
      - "8080:8080"
    environment:
      SOLARBANK_HOST: simulator
      SOLARBANK_PORT: "5020"
      METER_HOST: simulator
      METER_PORT: "5021"
    depends_on:
      - simulator
