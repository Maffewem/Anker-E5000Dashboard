# Paste this into Portainer (Stacks > Add stack > Web editor), or run
# `docker compose up -d` next to it. Then open http://<this-host>:8080 and
# enter the battery's IP address on the setup screen; it is saved in the
# data volume.
services:
  solarbank-dashboard:
    image: ghcr.io/maffewem/anker-e5000dashboard:latest
    container_name: solarbank-dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      TZ: "Europe/London"
      # Optional: fix the battery address here instead of using the setup
      # screen. When set, the setup screen shows it read-only.
      # SOLARBANK_HOST: "192.168.0.42"
      # POLL_SECONDS: "5"
      # RETENTION_DAYS: "365"
    volumes:
      - solarbank-data:/data
    # If the setup screen says there is no network route to the battery,
    # remove the "ports" section above and uncomment this line instead:
    # network_mode: host

volumes:
  solarbank-data:
